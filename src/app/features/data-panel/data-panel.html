<section class="card">
  <h3 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg>DỮ LIỆU</h3>
  <p class="sub">Dữ liệu tổng hợp (sinh theo seed)</p>

  <label>Số đặc trưng (≥ 3 chỉ hiện lát cắt 2 đặc trưng đầu)</label>
  <select aria-label="Số đặc trưng" (change)="store.featureCount.set(num($event))">
    @for (v of [1, 2, 3, 4, 5]; track v) {
    <option [value]="v" [selected]="v === store.featureCount()">{{ v }}</option>
    }
  </select>

  <label>Số mẫu</label>
  <input type="number" min="50" max="10000" [value]="store.sampleCount()"
    (change)="store.sampleCount.set(num($event))" />

  <label>Noise: {{ store.noise() }}%</label>
  <input type="range" min="0" max="50" step="1" [style.--range-fill]="(store.noise() / 50 * 100) + '%'" [value]="store.noise()" (input)="store.noise.set(num($event))" />

  <label>Tỉ lệ train/test: {{ (store.trainRatio() * 100).toFixed(0) }}%</label>
  <input type="range" min="10" max="90" step="10" [style.--range-fill]="((store.trainRatio() * 100 - 10) / 80 * 100) + '%'" [value]="store.trainRatio() * 100"
    (input)="store.trainRatio.set(num($event) / 100)" />

  <label>Seed</label>
  <div class="row">
    <input type="number" [value]="store.seed()" (change)="store.seed.set(num($event))" />
    <button (click)="shuffleSeed()">Xáo seed</button>
  </div>

  <button class="regen" (click)="store.generateData()">REGENERATE</button>
  <app-csv-import />
</section>
