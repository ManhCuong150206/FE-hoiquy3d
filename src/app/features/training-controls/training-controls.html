<section class="controls">
    <button (click)="store.reset()">⟲ Reset</button>
    <button class="play" (click)="toggle()">{{ store.status() === 'running' ? '❚❚' : '▶' }}</button>
    <button (click)="store.step()">Step</button>
    <button (click)="store.stop()">Stop</button>

    <div class="iter">Iteration {{ store.iteration() }} / {{ store.maxIterations() }}</div>

    <div class="field">
        <label>Thuật toán</label>
        <select (change)="store.setAlgorithm($any($event.target).value)">
            <option value="linear" [selected]="store.algorithm() === 'linear'">Linear Regression</option>
            <option value="polynomial" [selected]="store.algorithm() === 'polynomial'">Polynomial</option>
            <option value="ridge" [selected]="store.algorithm() === 'ridge'">Ridge</option>
            <option value="lasso" [selected]="store.algorithm() === 'lasso'">Lasso</option>
        </select>
    </div>

    @if (store.algorithm() === 'polynomial') {
    <div class="field">
        <label>Degree</label>
        <select (change)="store.setDegree(+$any($event.target).value)">
            @for (v of degreeOptions; track v) {
            <option [value]="v" [selected]="v === store.degree()">{{ v }}</option>
            }
        </select>
    </div>
    }

    @if (store.algorithm() === 'ridge' || store.algorithm() === 'lasso') {
    <div class="field">
        <label>Lambda (λ)</label>
        <select (change)="store.setLambda(+$any($event.target).value)">
            @for (v of lambdaOptions; track v) {
            <option [value]="v" [selected]="v === store.lambda()">{{ v }}</option>
            }
        </select>
    </div>
    }

    <div class="field">
        <label>Learning rate</label>
        <select (change)="store.setLearningRate(+$any($event.target).value)">
            @for (v of lrOptions; track v) {
            <option [value]="v" [selected]="v === store.learningRate()">{{ v }}</option>
            }
        </select>
    </div>

    <div class="field">
        <label>Max iterations</label>
        <select (change)="store.setMaxIterations(+$any($event.target).value)">
            @for (v of iterOptions; track v) {
            <option [value]="v" [selected]="v === store.maxIterations()">{{ v }}</option>
            }
        </select>
    </div>

    <div class="field">
        <label>Tốc độ phát</label>
        <select (change)="store.setSpeed(+$any($event.target).value)">
            @for (v of speedOptions; track v) {
            <option [value]="v" [selected]="v === store.speed()">{{ v }}x</option>
            }
        </select>
    </div>

    @if (store.lrError() ?? store.errorMsg(); as msg) {
    <p class="warn">⚠ {{ msg }}</p>
    }
</section>
