@if (view() === 'run') {
<section class="controls" aria-label="Điều khiển huấn luyện">
    <div class="run-controls">
    <button class="play" [class.running]="store.status() === 'running' || store.auto()" aria-label="Chạy hoặc tạm dừng" (click)="toggle()" [disabled]="store.switching() || (store.busy() && !store.auto())"><span aria-hidden="true">{{ store.status() === 'running' || store.auto() ? '⏸' : '▶' }}</span> {{ store.status() === 'running' || store.auto() ? 'Dừng' : 'Chạy' }}</button>
    <button (click)="store.step()" [disabled]="store.busy() || store.switching()">Step</button>
    <button class="stop" (click)="store.stop()">Stop</button>
    <button (click)="store.reset()">Reset</button>
    </div>
    <div class="field">
        <label for="iteration-speed">Nhịp chạy iteration</label>
        <select id="iteration-speed" (change)="store.setSpeed(+$any($event.target).value)">
            @for (v of speedOptions; track v) {
            <option [value]="v" [selected]="v === store.speed()">{{ v }}x</option>
            }
        </select>
    </div>
    <div class="field">
        <label for="learning-mode">Chế độ</label>
        <output id="learning-mode" class="selected-algorithm">Chạy bình thường</output>
    </div>
    @if (store.lrError() ?? store.errorMsg(); as msg) {
    <p class="warn">⚠ {{ msg }}</p>
    }
</section>
} @else {
    <div class="parameter-controls">

    <div class="field">
        <label for="selected-algorithm">Thuật toán đã chọn</label>
        <output id="selected-algorithm" class="selected-algorithm" [attr.data-value]="store.algorithm()" [attr.data-algorithm]="store.algorithm()"><span aria-hidden="true"></span>{{ labels[store.algorithm()] }} Regression</output>
    </div>

    @if (store.algorithm() === 'polynomial') {
    <div class="field">
        <label for="degree">Degree</label>
        <select id="degree" (change)="store.setDegree(+$any($event.target).value)">
            @for (v of degreeOptions; track v) {
            <option [value]="v" [selected]="v === store.degree()">{{ v }}</option>
            }
        </select>
    </div>
    }

    @if (store.algorithm() === 'ridge' || store.algorithm() === 'lasso') {
    <div class="field">
        <label for="lambda">Lambda (λ)</label>
        <select id="lambda" (change)="store.setLambda(+$any($event.target).value)">
            @for (v of lambdaOptions; track v) {
            <option [value]="v" [selected]="v === store.lambda()">{{ v }}</option>
            }
        </select>
    </div>
    }

    <div class="field">
        <label for="learning-rate">Learning rate</label>
        <select id="learning-rate" (change)="store.setLearningRate(+$any($event.target).value)">
            @for (v of lrOptions; track v) {
            <option [value]="v" [selected]="v === store.learningRate()">{{ v }}</option>
            }
        </select>
    </div>

    <div class="field">
        <label for="max-iterations">Max iterations</label>
        <select id="max-iterations" (change)="store.setMaxIterations(+$any($event.target).value)">
            @for (v of iterOptions; track v) {
            <option [value]="v" [selected]="v === store.maxIterations()">{{ v }}</option>
            }
        </select>
    </div>

    </div>
}
