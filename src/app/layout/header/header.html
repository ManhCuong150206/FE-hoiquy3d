<header class="bar">
    <div class="brand">
        <span class="logo" aria-hidden="true">◈</span>
        <div class="titles">
            <h1>Hồi quy 3D</h1>

        </div>
    </div>

    <div class="status">
        <button type="button" (click)="themeStore.toggle()" [disabled]="themeStore.transitioning()"
            [attr.aria-pressed]="themeStore.theme() === 'dark'"
            [attr.aria-label]="themeStore.theme() === 'dark' ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối'">
            <span aria-hidden="true">{{ themeStore.theme() === 'dark' ? '☾' : '☀' }}</span>
            {{ themeStore.theme() === 'dark' ? 'Tối' : 'Sáng' }}
        </button>
        <span class="chip" [class.off]="!exp.online()" role="status">
            <i class="dot"></i>{{ exp.online() ? 'Trực tuyến' : 'Ngoại tuyến' }}
        </span>

        @if (exp.pendingCount() > 0) {
        <small class="pending" role="status">
            Có {{ exp.pendingCount() }} file đang chờ đồng bộ.
            <span>Chỉ đồng bộ khi bạn nhấn nút.</span>
        </small>
        <button type="button" (click)="exp.sync()" [disabled]="!exp.online() || exp.syncing()">
            {{ exp.syncing() ? 'Đang đồng bộ…' : 'Đồng bộ ngay' }}
        </button>
        }

        @if (exp.syncError(); as err) {
        <span class="error" role="alert">{{ err }}</span>
        }
    </div>
</header>
